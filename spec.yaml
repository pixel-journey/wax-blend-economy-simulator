blueprint:
  id: wax-blend-economy-simulator
  name: Blend Economy Simulator
  tier: 2
  category: atomic-ecosystem
  status: refined
  version: "0.5.0"
  last_refined: "2026-10-15"

metadata:
  description: |
    Educational and production-oriented toolkit for modeling Atomic Blend
    economics on WAX before launch — costs, expected value, participation
    assumptions, and sustainability heuristics.
  related_blueprints:
    - wax-blends-creator-and-visualizer
    - wax-advanced-drop-mechanics-toolkit
  foundational_repos:
    - pixel-journey-standards
    - pixel-journey-templates
    - gitbook-docs
    - wax-ecosystem-blueprint-catalog

modeling_invariants:
  - All economic math lives in pure functions
  - Assumptions are parameters, not magic numbers
  - At least two scenarios should be comparable
  - Insights cite the metric that triggered them
  - Simulation output is never presented as guaranteed reality
  - Accessibility applies to controls and key metrics

features:
  implemented:
    - Pure engines (netMargin, participationPressure, sustainabilityScore, computeMetrics, generateInsights)
    - EconomicVisualizer
    - InsightsPanel with trigger-traced recommendations
    - Supporting examples (ParameterControls, ScenarioComparison, ExportPanel, demo)
  planned:
    - Richer multi-recipe portfolio models
    - Time-series participation decay
    - Live supply data hooks

integration_levels:
  minimal:
    description: Parameters + basic metrics
  recommended:
    description: Full simulator + insights + scenario comparison
  advanced:
    description: Batch runs, richer models, analytics hooks

machine_instructions:
  - Keep all economic math in pure functions under examples/engines.ts
  - Make assumptions explicit parameters
  - Prefer actionable insights with clear triggers
  - Never present simulation output as guaranteed real-world outcomes
  - Support Minimal / Recommended / Advanced levels

technical_requirements:
  framework: Next.js 15 + TypeScript (strict)
  styling: Tailwind CSS
  simulation: Pure client-side TypeScript engines

file_structure:
  - examples/types.ts
  - examples/engines.ts
  - examples/EconomicVisualizer.tsx
  - examples/InsightsPanel.tsx
  - examples/ParameterControls.tsx
  - examples/ScenarioComparison.tsx
  - examples/ExportPanel.tsx
  - examples/demo.tsx
  - ARCHITECTURE.md
  - README.md
  - spec.yaml
  - AI_PROMPTS.md
